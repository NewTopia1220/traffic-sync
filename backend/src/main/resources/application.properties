spring.application.name=traffic-sync
server.port=8080
spring.config.import=classpath:application-secret.properties

# ===== V2X API =====
v2x.api.crossroad-url=https://apis.data.go.kr/B551982/rti/crsrd_map_info
v2x.api.signal-url=https://apis.data.go.kr/B551982/rti/tl_drct_info
v2x.api.num-of-rows=1000

# ===== Jamsil PoC =====
jamsil.lat=37.5133
jamsil.lon=127.1002
jamsil.radius-km=1.0

# ===== Polling interval (ms) =====
traffic.poll.interval-ms=30000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== HikariCP 커넥션 풀 =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000

# ===== Groq AI =====
grok.api.url=https://api.groq.com/openai/v1/chat/completions
grok.api.model=llama-3.3-70b-versatile

# ===== Stub (더미 데이터 모드) =====
traffic.context.stub=true

# ===== Debug =====
logging.level.com.example.demo.service.V2xApiService=DEBUG
